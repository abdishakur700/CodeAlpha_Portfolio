<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Counter app preview</title>
  <desc id="desc">A dark counter app interface with plus, count, and minus controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#background)"/>
  <circle cx="1050" cy="80" r="210" fill="#06b6d4" opacity=".12"/>
  <circle cx="120" cy="680" r="260" fill="#2563eb" opacity=".14"/>
  <rect x="250" y="90" width="700" height="540" rx="28" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".35" stroke-width="3"/>
  <text x="600" y="190" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">COUNTER APP</text>
  <text x="600" y="400" fill="#f8fafc" font-family="Arial, sans-serif" font-size="150" font-weight="700" text-anchor="middle">0</text>
  <g font-family="Arial, sans-serif" font-size="64" font-weight="700" text-anchor="middle">
    <rect x="340" y="475" width="170" height="90" rx="16" fill="#2563eb"/>
    <text x="425" y="540" fill="#fff">−</text>
    <rect x="515" y="475" width="170" height="90" rx="16" fill="#06b6d4"/>
    <text x="600" y="540" fill="#082f49">↻</text>
    <rect x="690" y="475" width="170" height="90" rx="16" fill="#2563eb"/>
    <text x="775" y="540" fill="#fff">+</text>
  </g>
</svg>
